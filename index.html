    const pctClass = (value) => {
      if (value >= 80) return 'pct-good';
      if (value >= 50) return 'pct-warn';
      return 'pct-bad';
    };

    const barColor = (value) => {
      if (value >= 80) return 'var(--good)';
      if (value >= 50) return 'var(--warn)';
      return 'var(--bad)';
    };

    const renderSummary = () => {
      const el = document.getElementById('summary');
      const cards = [
        ['Product areas', DATA.moduleCount],
        ['Files', DATA.fileCount],
        ...['lines', 'statements', 'functions', 'branches'].map((key) => [
          key.charAt(0).toUpperCase() + key.slice(1),
          DATA.total[key].pct + '%',
        ]),
      ];
      el.innerHTML = cards
        .map(([label, value]) => `
          <div class="summary-card">
            <div class="label">${label}</div>
            <div class="value ${typeof value === 'string' && value.endsWith('%') ? pctClass(parseFloat(value)) : ''}">${value}</div>
          </div>`)
        .join('');
    };

    const renderModule = (mod) => {
      const linesPct = mod.metrics.lines.pct;
      return `
        <article class="module" data-module="${mod.id}" data-lines-pct="${linesPct}" data-file-count="${mod.fileCount}">
          <div class="module-header" role="button" tabindex="0" aria-expanded="false">
            <div>
              <span class="chevron">▶</span>
              <span class="module-name">${mod.label}</span>
              <span class="module-meta"> · ${mod.fileCount} files</span>
              ${mod.description ? `<div class="module-desc">${mod.description}</div>` : ''}
              <div class="bar"><span style="width:${linesPct}%;background:${barColor(linesPct)}"></span></div>
            </div>
            <div class="metric-pills">
              ${['lines','statements','functions','branches'].map((m) =>
                `<span class="pill"><strong class="${pctClass(mod.metrics[m].pct)}">${mod.metrics[m].pct}%</strong> ${m}</span>`
              ).join('')}
            </div>
          </div>
          <div class="module-files">
            <table>
              <thead>
                <tr>
                  <th>File</th>
                  <th class="num">Lines</th>
                  <th class="num">Stmts</th>
                  <th class="num">Funcs</th>
                  <th class="num">Branches</th>
                </tr>
              </thead>
              <tbody>
                ${mod.files.map((f) => `
                  <tr>
                    <td><a href="${f.lcovHref}" target="_blank" rel="noopener">${f.displayPath}</a></td>
                    ${['lines','statements','functions','branches'].map((m) =>
                      `<td class="num ${pctClass(f.metrics[m].pct)}">${f.metrics[m].pct}%</td>`
                    ).join('')}
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </article>`;
    };

    const populateModuleFilter = () => {
      const select = document.getElementById('moduleFilter');
      for (const mod of DATA.modules) {
        const opt = document.createElement('option');
        opt.value = mod.id;
        opt.textContent = mod.label;
        select.appendChild(opt);
      }
    };

    const getFilters = () => ({
      search: document.getElementById('search').value.trim().toLowerCase(),
      minPct: document.getElementById('minPct').value === '' ? 0 : Number(document.getElementById('minPct').value),
      maxPct: document.getElementById('maxPct').value === '' ? 100 : Number(document.getElementById('maxPct').value),
      module: document.getElementById('moduleFilter').value,
      sortBy: document.getElementById('sortBy').value,
    });

    const moduleMatchesSearch = (mod, search) => {
      if (!search) return true;
      if (mod.label.toLowerCase().includes(search)) return true;
      if (mod.description && mod.description.toLowerCase().includes(search)) return true;
      return mod.files.some((f) => f.displayPath.toLowerCase().includes(search));
    };

    const sortModules = (modules, sortBy) => {
      const copy = [...modules];
      switch (sortBy) {
        case 'lines-desc':
          return copy.sort((a, b) => b.metrics.lines.pct - a.metrics.lines.pct);
        case 'lines-asc':
          return copy.sort((a, b) => a.metrics.lines.pct - b.metrics.lines.pct);
        case 'files-desc':
          return copy.sort((a, b) => b.fileCount - a.fileCount);
        case 'name':
          return copy.sort((a, b) => a.label.localeCompare(b.label));
        case 'product-order':
        default:
          return copy;
      }
    };

    const renderModules = () => {
      const { search, minPct, maxPct, module, sortBy } = getFilters();
      const filtered = DATA.modules.filter((mod) => {
        if (module && mod.id !== module) return false;
        const pct = mod.metrics.lines.pct;
        if (pct < minPct || pct > maxPct) return false;
        return moduleMatchesSearch(mod, search);
      });
      const sorted = sortModules(filtered, sortBy);
      const container = document.getElementById('modules');
      const empty = document.getElementById('empty');
      container.innerHTML = sorted.map(renderModule).join('');
      empty.classList.toggle('hidden', sorted.length > 0);

      container.querySelectorAll('.module-header').forEach((header) => {
        const toggle = () => {
          const article = header.closest('.module');
          const open = article.classList.toggle('expanded');
          header.setAttribute('aria-expanded', open ? 'true' : 'false');
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
      });
    };

    populateModuleFilter();
    renderSummary();
    renderModules();
    ['search', 'minPct', 'maxPct', 'moduleFilter', 'sortBy'].forEach((id) => {
      document.getElementById(id).addEventListener('input', renderModules);
      document.getElementById(id).addEventListener('change', renderModules);
    });
  </script>
